		const updateInterval = setInterval(async () => {
			if (GLOBAL_SESSION_TOKEN != "") {
				await getApplicationStates();
				await renderApplicationList();
				updateTimeRemaining();
			}
		}, 500)

		async function startApp(idx) {
			var appName = applications[idx].app_name;
			if (applications[idx].state.gui_state != "READY") {
				var response = await fetch(`/uapi/api/start?app=${appName}`);
			} else {
				args = []
				args.push(KAGE_COOKIE_NAME + "=" + GLOBAL_SESSION_TOKEN);
				if (applications[idx].config.set_cookie != null) {
					var cookieKeys = Object.keys(applications[idx].config.set_cookie);
					for (var i = 0; i < cookieKeys.length; i += 1) {
						if (cookieKeys[i] == "redirect") {
							continue;
						}
						args.push(cookieKeys[i] + "=" + applications[idx].config.set_cookie[cookieKeys[i]])
					}
				}
				args.push("redirect=" + encodeURI(applications[idx].config.job_url));
				window.location.href = window.location.protocol + "//" + applications[idx].domain + "/kagemori/mapi/uri/setcookie?" + args.join("&");
			}
		}
		async function stopApp(idx) {
			var appName = applications[idx].app_name;
			if (applications[idx].state.gui_state != "READY") {
				var response = await fetch(`/uapi/api/stop?app=${appName}`);
			}
		}


		async function getApplicationStates() {
			var response = await fetch("/uapi/api/state");
			var jsonResponse = await response.json();
			applications = jsonResponse;
			return true;
		}

		function getButtonStatusString(guiState) {
			if (guiState == "READY") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).buttonTextConnect;
			}
			if (guiState == "STOPPING") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).buttonTextStopping;
			}
			if (guiState == null) {
				return (STRINGS[navigator.language] || STRINGS['en-US']).buttonTextStart;
			}
			return (STRINGS[navigator.language] || STRINGS['en-US']).buttonTextStarting;
		}

		function getButtonClass(guiState) {
			if (guiState == "READY" || guiState == null) {
				return "";
			}
			return "application-button-disabled"
		}

		function getStatusText(guiState) {
			if (guiState == "READY") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextReady;
			}
			if (guiState == null) {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextStopped;
			}
			if (guiState == "SECURE") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextSecure;
			}
			if (guiState == "RESOURCE") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextResource;
			}
			if (guiState == "STARTED") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextStarted;
			}
			if (guiState == "CONFIG") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextConfig;
			}
			if (guiState == "FAILED") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextFailed;
			}
			if (guiState == "STOPPING") {
				return (STRINGS[navigator.language] || STRINGS['en-US']).statusTextStopping;
			}
		}

		function getCircleColour(guiState) {
			if (guiState == null) {
				return "circle-blue";
			}
			if (guiState == "READY") {
				return "circle-green";
			}
			if (guiState == "FAILED") {
				return "circle-red";
			}
			if (guiState == "STOPPING") {
				return "circle-red-pulse";
			}
			return "circle-yellow";
		}

		async function renderApplicationList() {
			// Use the applications variable
			var appList = document.getElementById(IDS.applicationList);
			appList.innerHTML = "";

			for (var i = 0; i < applications.length; i += 1) {
				var indexApp = applications[i];
				console.log(indexApp);
				var buttonText = getButtonStatusString(indexApp.state.gui_state);
				var circleClass = getCircleColour(indexApp.state.gui_state);
				var statusText = getStatusText(indexApp.state.gui_state);
				var buttonClass = getButtonClass(indexApp.state.gui_state);
				appList.innerHTML += `
					<div class="application-item">
	       					<div class="application-item-left">
							<span class="application-title">${indexApp.app_name}</span>
							<span class="application-subtext">${indexApp.path}</span>
							<div class="application-state-subtext">
								<div class="circle ${circleClass}"></div><span class="application-state-font">${statusText}</span>
								<span class="application-time-remaining" id="time-remaining-${i}"></span>
							</div>
	       					</div>
	       					<div class="application-item-right">
							<span class="application-button application-button-left ${buttonClass}" onclick=startApp(${i}) id="app-button-${i}">${buttonText}</span>
							<span class="application-button application-button-right ${buttonClass}" onclick=stopApp(${i}) id="app-button-${i}">×</span>
	       					</div>
	       				</div>
	       			`;
				
			}
		}

		function updateTimeRemaining() {
			for (var i = 0; i < applications.length; i += 1) {
				if (applications[i].state.end_date != null) {
					if (applications[i].state.gui_state != "READY") {
						document.getElementById(`time-remaining-${i}`).innerHTML = "";
						continue;
					}
					var end = new Date(applications[i].state.end_date + "Z");
					var now = new Date();
					var diff = end - now;
					
					var hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0')
					var minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
					var seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

					// TODO: Locale spesific
					document.getElementById(`time-remaining-${i}`).innerHTML = `(${hours}:${minutes}:${seconds} remaining)`
				}
			}
		}

		async function login() {
			GLOBAL_STATE = GLOBAL_STATE_AUTHENTICATING;
			updateLoginState();
			
			var testAuth = await fetch("/uapi/api/state");
			if (testAuth.status == 200) {
				GLOBAL_SESSION_TOKEN = readCookies().kageauth;
				if (await getApplicationStates()) {
					await renderApplicationList();
				}

				GLOBAL_STATE = GLOBAL_STATE_APPLICATION_SELECT;
				updateLoginState();
				return;
			}

			var submitData = {
				username: document.getElementById("input-username").value,
				password: document.getElementById("input-password").value
			}
			
			var loginResponse = await fetch("/kagemori/mapi/login", {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json; charset=utf8'
				},
				body: JSON.stringify(submitData)
			});
			
			var loginJsonResponse = await loginResponse.json();
			if (loginJsonResponse["error"] != null) {
				ERROR_MESSAGE = loginJsonResponse["error"];
				GLOBAL_STATE = GLOBAL_STATE_ERROR;
				updateLoginState();
				return;
			}

			// Obtain session token
			GLOBAL_SESSION_TOKEN = loginJsonResponse["session-token"];
			setCookie(KAGE_COOKIE_NAME, GLOBAL_SESSION_TOKEN);
			if (await getApplicationStates()) {
				await renderApplicationList();
			}

			GLOBAL_STATE = GLOBAL_STATE_APPLICATION_SELECT;
			updateLoginState();
		}

		async function legacyLogin() {
			GLOBAL_STATE = GLOBAL_STATE_AUTHENTICATING;
			updateLoginState();

			if (!readCookies().kageauth) {
				var submit_data = {
					username: document.getElementById("input-username").value,
					password: document.getElementById("input-password").value
				}
				
				var response = await fetch("/kagemori/mapi/login", {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json; charset=utf8'
					},
					body: JSON.stringify(submit_data)
				})

				jsonResponse = await response.json();
				if (jsonResponse["error"] != null) {
					ERROR_MESSAGE = jsonResponse["error"];
					GLOBAL_STATE = GLOBAL_STATE_ERROR;
					updateLoginState();
					console.log(jsonResponse);

					return;	
				}
				GLOBAL_SESSION_TOKEN = jsonResponse["session-token"];

				// Update cookies
				setCookie(KAGE_COOKIE_NAME, GLOBAL_SESSION_TOKEN);
			} else {
				GLOBAL_SESSION_TOKEN = readCookies().kageauth;
			}

			// Update global state
			GLOBAL_STATE = GLOBAL_STATE_JOB_CHECK_STATE;
			updateLoginState();

			// Check that there is no job running already
			var response = await fetch("/uapi/api/state", {
				method: 'GET',
			});
			if (!response.ok) {
				GLOBAL_STATE = GLOBAL_STATE_LOGIN;
				setCookie(KAGE_COOKIE_NAME, "", -1000);
				updateLoginState();

				return;

			}
			userDaemonResponse = await response.json();
			console.log(userDaemonResponse);
			if (userDaemonResponse.state == "RUNNING") {
				GLOBAL_STATE = GLOBAL_STATE_JOB_RESUMING;
				updateLoginState();

				// Obtain redirect URL
				var response = await fetch("/uapi/redirect");
				userDaemonResponse = await response.json();
				await new Promise(r => setTimeout(r, 1000));
				
				document.location = userDaemonResponse.job_url;
			}
			if (userDaemonResponse.state == "STOPPED") {
				// Start a new job
				GLOBAL_STATE = GLOBAL_STATE_JOB_START_RQ;
				updateLoginState();

				var response = fetch("/uapi/api/start");
				while (true) {
					// Sleep for 1 second
					await new Promise(r => setTimeout(r, 1000));
					var response = await fetch("/uapi/api/state");
					userDaemonResponse = await response.json();
					console.log(userDaemonResponse)

					if (userDaemonResponse.state == "QUEUED") {
						GLOBAL_STATE = GLOBAL_STATE_JOB_RESOURCE;	
						updateLoginState();
					}
					if (userDaemonResponse.state == "STARTING") {
						GLOBAL_STATE = GLOBAL_STATE_JOB_CONFIG;	
						updateLoginState();
					}
					if (userDaemonResponse.state == "RUNNING") {
						GLOBAL_STATE = GLOBAL_STATE_JOB_STARTED;
						updateLoginState();
						await new Promise(r => setTimeout(r, 700));
						break;
					}

				}
				// Obtain redirect URL
				var response = await fetch("/uapi/redirect");
				userDaemonResponse = await response.json();

				document.location = userDaemonResponse.job_url;
			}
		}

		function readCookies() {
			var response = {}

			var cookieTokens = document.cookie.split(';');
			// Shamelessly borrowed from Mandeep Janjua on StakOverflow
			// https://stackoverflow.com/questions/14573223/set-cookie-and-get-cookie-with-javascript
			for (var i = 0; i < cookieTokens.length; i += 1) {
				var token = cookieTokens[i];
				// Remove whitespace
				while (token.charAt(0) == ' ' && token.length > 2) {
					token = token.substring(1, token.length);
				}

				token = token.split("=");
				response[token[0]] = token[1];
			}
			return response;
		}

		function setCookie(cookieKey, cookieValue, cookieDaysExpire = 7) {
			var expires = "";
			if (cookieDaysExpire) {
				var cookieExpireDate = new Date();
				cookieExpireDate.setTime(cookieExpireDate.getTime() + (cookieDaysExpire*86400000));
				expires = cookieExpireDate.toUTCString();
			}
			
			document.cookie = cookieKey + "=" + cookieValue + "; SameSite=Lax; expires=" + expires + "; path=/";
		}

		function hideLoginForm() {
			document.getElementById(IDS.loginForm).style.display = "none";
		}
		
		function showLoginForm() {
			document.getElementById(IDS.loginForm).style.display = "flex";

		function hideLoginState() {
			document.getElementById(IDS.loginState).style.display = "none";

		function showLoginState() {
			document.getElementById(IDS.loginState).style.display = "flex";
		}

		function hideError() {
			document.getElementById(IDS.errorContainer).style.display = "none";
		}

		function showError() {
			document.getElementById(IDS.errorContainer).style.display = "flex";
		}

		function hideAppList() {
			document.getElementById(IDS.applicationList).style.display = "none";
		}

		function showAppList() {
			document.getElementById(IDS.applicationList).style.display = "flex";
		}

		function updateLoginState() {
			var stateTextElement = document.getElementById(IDS.loginStateText);
			var errorMessageElement = document.getElementById(IDS.errorMessageDesc);
			console.log(GLOBAL_STATE);
			if (GLOBAL_STATE == GLOBAL_STATE_LOGIN) {
				hideLoginState();
				showLoginForm();
				hideError();
				hideAppList();
			}
			if (GLOBAL_STATE == GLOBAL_STATE_AUTHENTICATING) {
				hideLoginForm();
				showLoginState();
				hideError();
				hideAppList();
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateAuthenticating;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_APPLICATION_SELECT) {
				hideLoginForm();
				hideLoginState();
				hideError();
				showAppList();
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_CHECK_STATE) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateCheckingJobState;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_START_RQ) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateJobStartRequested;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_RESOURCE) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateJobResources;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_CONFIG) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateJobAwaitConfig;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_STARTED) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateJobStarted;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_JOB_RESUMING) {
				stateTextElement.innerHTML = (STRINGS[navigator.language] || STRINGS['en-US']).stateJobResuming;
			}
			if (GLOBAL_STATE == GLOBAL_STATE_ERROR) {
				errorMessageElement.innerHTML = ERROR_MESSAGE;
				showLoginForm();
				showError();
				hideLoginState();
			}
		}

		function checkCanLogin() {
			if (readCookies().kageauth) {
				login();
			}
		}

		window.onload = function () {
			checkCanLogin();
		}
